# Operations-only configuration. Development uses a separate nginx.conf.
# Render and verify /etc/nginx/waf-security with deploy/security/render_proxy.py.
include /etc/nginx/waf-security/http.conf;

server {
  listen 80 default_server;
  server_name _;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $waf_api_target api:8000;
  client_max_body_size 11m;
  access_log /var/log/nginx/access.log waf_minimal;
  # nginx error records can contain the complete request/query string.
  error_log /dev/null crit;
  include /etc/nginx/waf-security/server.conf;

  # Match the canonical login path and its redirecting trailing-slash variant.
  # nginx normalizes percent escapes and repeated slashes before matching.
  location ~ ^/api/v1/auth/login/?$ {
    limit_req zone=waf_login burst=5 nodelay;
    limit_req_status 429;
    include /etc/nginx/waf-security/proxy.conf;
    proxy_pass http://$waf_api_target;
  }

  location /api/ {
    include /etc/nginx/waf-security/proxy.conf;
    proxy_pass http://$waf_api_target;
  }

  location /health/ {
    include /etc/nginx/waf-security/proxy.conf;
    proxy_pass http://$waf_api_target;
  }

  location ~ ^/(docs(?:/oauth2-redirect)?/?|openapi\.json)$ {
    include /etc/nginx/waf-security/proxy.conf;
    proxy_pass http://$waf_api_target;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
