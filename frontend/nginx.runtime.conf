# No root master or writable /etc/nginx is needed at runtime.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  keepalive_timeout 65;
  client_body_temp_path /tmp/waf-client-body;
  proxy_temp_path /tmp/waf-proxy;
  fastcgi_temp_path /tmp/waf-fastcgi;
  uwsgi_temp_path /tmp/waf-uwsgi;
  scgi_temp_path /tmp/waf-scgi;
  include /etc/nginx/conf.d/*.conf;
}
