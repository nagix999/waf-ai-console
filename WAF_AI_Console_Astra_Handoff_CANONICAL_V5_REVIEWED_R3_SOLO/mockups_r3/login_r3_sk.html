<!doctype html>
<html lang="ko" data-theme="sk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>WAF AI Console Login</title>
<style>
:root{--bg:#f6f8fa;--panel:#fff;--text:#172033;--muted:#6b778c;--line:#e2e8ee;--input:#fbfcfd;--primary:#202834;--primary-hover:#161d26;--brand:#e3222d}
*{box-sizing:border-box} html,body{height:100%;margin:0}
body{font-family:Inter,Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center}
.shell{width:100%;min-height:100%;position:relative;display:flex;align-items:center;justify-content:center;padding:40px}
.topbar{position:absolute;top:26px;left:32px;right:32px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;letter-spacing:-.01em}
.brandmark{width:10px;height:10px;border-radius:3px;background:var(--brand);box-shadow:12px 0 0 #ff6b2c;margin-right:12px}
.theme{height:34px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:0 11px;font-size:12px;color:#4c5a6b}
.card{width:400px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:34px 34px 30px;box-shadow:0 10px 32px rgba(23,32,51,.06)}
h1{margin:0;font-size:24px;line-height:1.25;letter-spacing:-.025em}.sub{margin:8px 0 28px;font-size:13px;color:var(--muted)}
label{display:block;margin:0 0 8px;font-size:12px;font-weight:650;color:#344054}.field{margin-bottom:18px}
input{width:100%;height:42px;border:1px solid #d7dee6;background:var(--input);border-radius:9px;padding:0 12px;font-size:14px;color:var(--text);outline:none}
input:focus{border-color:#9fcdbb;box-shadow:0 0 0 3px rgba(124,207,177,.16);background:#fff}
button.login{margin-top:6px;width:100%;height:42px;border:0;border-radius:9px;background:var(--primary);color:#fff;font-size:13px;font-weight:700;cursor:pointer}
button.login:hover{background:var(--primary-hover)}.footer{margin-top:22px;padding-top:18px;border-top:1px solid #edf1f4;font-size:11px;color:#8a96a6;text-align:center}
@media(max-width:560px){.shell{padding:24px}.topbar{left:20px;right:20px;top:20px}.card{width:100%;padding:28px 24px}}
</style></head>
<body><main class="shell"><header class="topbar"><div class="brand"><span class="brandmark"></span><span>WAF AI Console</span></div><button class="theme" type="button">SK ▾</button></header>
<section class="card" aria-label="로그인"><h1>로그인</h1><p class="sub">관리자 계정으로 로그인하세요.</p><form><div class="field"><label for="username">아이디</label><input id="username" name="username" autocomplete="username" placeholder="아이디"/></div><div class="field"><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="비밀번호"/></div><button class="login" type="submit">로그인</button></form><div class="footer">WAF AI Console</div></section></main></body></html>
